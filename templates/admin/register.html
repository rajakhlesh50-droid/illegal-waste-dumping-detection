<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration & Sign Up - WasteAI Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --border-color: #1e293b;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.35);
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
        }

        .register-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.05);
            position: relative;
            overflow: hidden;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #10b981, #059669);
        }

        .register-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .register-icon-box {
            width: 58px;
            height: 58px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            color: var(--primary);
            font-size: 24px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .register-header h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .register-header p {
            color: #94a3b8;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 11px 40px 11px 40px;
            color: #ffffff;
            font-size: 13px;
            transition: all 0.2s;
        }

        .form-select {
            appearance: none;
            cursor: pointer;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: #0f172a;
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--primary-glow);
            margin-top: 14px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #047857, #059669);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .login-redirect-box {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            padding-top: 16px;
            border-top: 1px solid #1e293b;
        }

        .login-redirect-box a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .login-redirect-box a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="register-header">
            <div class="register-icon-box">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>User Registration</h1>
            <p>Create your verified WasteAI account</p>
        </div>

        {% if error %}
        <div class="error-banner">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('admin_register') }}" method="POST">
            <!-- USERNAME -->
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Choose unique username (e.g. user_raj)" 
                        required 
                        autocomplete="username"
                        value="{{ request.form.get('username', '') }}"
                    >
                </div>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="e.g. user@wasteai.gov.in" 
                        required 
                        value="{{ request.form.get('email', '') }}"
                    >
                </div>
            </div>

            <!-- SECURITY QUESTION -->
            <div class="form-group">
                <label class="form-label" for="security_question">Security Question (For Password Recovery)</label>
                <div class="input-group">
                    <i class="fa-solid fa-shield-cat input-icon"></i>
                    <select id="security_question" name="security_question" class="form-select" required>
                        <option value="What is your surveillance deployment city?">What is your surveillance deployment city?</option>
                        <option value="What is the model name of your primary camera?">What is the model name of your primary camera?</option>
                        <option value="What was your first childhood pet's name?">What was your first childhood pet's name?</option>
                        <option value="What is your favorite environmental project?">What is your favorite environmental project?</option>
                    </select>
                </div>
            </div>

            <!-- SECURITY ANSWER -->
            <div class="form-group">
                <label class="form-label" for="security_answer">Security Answer</label>
                <div class="input-group">
                    <i class="fa-solid fa-circle-question input-icon"></i>
                    <input 
                        type="text" 
                        id="security_answer" 
                        name="security_answer" 
                        class="form-input" 
                        placeholder="Enter secret answer (e.g. Paralakhemundi)" 
                        required
                    >
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label class="form-label" for="password">Create Password</label>
                <div class="input-group">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Minimum 6 characters" 
                        required
                    >
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-input" 
                        placeholder="Re-enter password" 
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Complete User Registration</span>
                <i class="fa-solid fa-user-check"></i>
            </button>
        </form>

        <div class="login-redirect-box">
            Already have an account? 
            <a href="{{ url_for('admin_login') }}">Sign In here</a>
        </div>

        <a href="{{ url_for('index') }}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Return to Live Dashboard
        </a>
    </div>

</body>
</html>
